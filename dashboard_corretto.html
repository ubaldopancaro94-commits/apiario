<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Dashboard Apiario</title><style>*{box-sizing:border-box}html,body{max-width:100%;overflow-x:hidden}body{margin:0;padding:10px;font-family:Arial,sans-serif;background:#f7f7f7;color:#222;font-size:13px}.wrap{max-width:1200px;margin:auto}h1{font-size:22px;margin:6px 0 12px}.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}.kpi{background:#fff;border:1px solid #ddd;border-radius:12px;padding:10px;text-align:center}.kpi b{display:block;font-size:20px}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}.toolbar input,.toolbar select,.toolbar button{padding:9px;border:1px solid #ccc;border-radius:9px;background:#fff;font:inherit}.toolbar input{flex:1;min-width:150px}.toolbar button{background:#a86400;color:#fff;border:0;font-weight:700}.tablewrap{background:#fff;border:1px solid #ddd;border-radius:14px;overflow:auto}table{width:100%;border-collapse:collapse;min-width:960px}th,td{padding:9px 7px;border-bottom:1px solid #eee;text-align:left;vertical-align:top;white-space:normal;overflow-wrap:anywhere}th{position:sticky;top:0;background:#f1f1f1;z-index:1;font-size:12px}td{font-size:12px}.arnia{font-weight:700;color:#8a5300;text-decoration:none}.muted{color:#777}.error{color:#b00020;background:#fff;border:1px solid #f2b8b5;border-radius:10px;padding:10px}.mobile{display:none}@media(max-width:720px){body{padding:7px}.summary{grid-template-columns:repeat(3,1fr)}.desktop{display:none}.mobile{display:block}.hive{background:#fff;border:1px solid #ddd;border-radius:13px;padding:10px;margin:8px 0}.hive-head{display:flex;justify-content:space-between;gap:8px;margin-bottom:7px}.hive-grid{display:grid;grid-template-columns:1fr 1fr;gap:5px 10px}.hive-grid div{overflow-wrap:anywhere}.note{grid-column:1/-1}.kpi{padding:8px}.kpi b{font-size:17px}}
</style></head><body><main class="wrap"><h1>🐝 Dashboard Apiario</h1><section class="summary"><div class="kpi"><b>50</b>Arnie</div><div class="kpi"><b id="withData">0</b>Con dati</div><div class="kpi"><b id="withoutData">50</b>Senza dati</div></section><div class="toolbar"><input id="search" placeholder="Cerca A01, regina, note..."><select id="range"><option value="all">Tutte A01-A50</option><option value="1-10">A01-A10</option><option value="11-20">A11-A20</option><option value="21-30">A21-A30</option><option value="31-40">A31-A40</option><option value="41-50">A41-A50</option></select><button id="reload">↻ Aggiorna</button></div><div id="status" class="muted">Caricamento dati...</div><div class="tablewrap desktop"><table><thead><tr><th>Arnia</th><th>Regina</th><th>Covata</th><th>Scorte</th><th>Forza</th><th>Peso</th><th>Temp.</th><th>Umidità</th><th>Suono</th><th>Prossima azione</th><th>Note</th><th>Ultima visita</th></tr></thead><tbody id="tbody"></tbody></table></div><div id="cards" class="mobile"></div></main><script>
'use strict';const URL='https://zyigecgmidnpacnfwlym.supabase.co',KEY='sb_publishable_nZVA6m0GfnF6nthL2Exh3A_5PMhouC0',API=URL+'/rest/v1/Visite',HEAD={apikey:KEY,Authorization:'Bearer '+KEY};let latest=[];
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const hive=i=>'A'+String(i).padStart(2,'0');const fmt=d=>d?new Date(d).toLocaleString('it-IT'):'Mai';
async function request(){const r=await fetch(API+'?select=*&order=data_visita.desc',{headers:HEAD,mode:'cors'}),t=await r.text();if(!r.ok)throw new Error('HTTP '+r.status+' '+t);return JSON.parse(t)}
function selectLatest(rows){const m=new Map();for(const x of rows){if(!m.has(x.arnia))m.set(x.arnia,x)}return Array.from({length:50},(_,i)=>m.get(hive(i+1))||{arnia:hive(i+1)})}
function filtered(){let v=latest.slice(),q=document.getElementById('search').value.trim().toLowerCase(),rg=document.getElementById('range').value;if(rg!=='all'){let[a,b]=rg.split('-').map(Number);v=v.filter(x=>{let n=Number(x.arnia.slice(1));return n>=a&&n<=b})}if(q)v=v.filter(x=>Object.values(x).some(z=>String(z??'').toLowerCase().includes(q)));return v}
function show(){const v=filtered();document.getElementById('tbody').innerHTML=v.map(x=>`<tr><td><a class="arnia" href="./?arnia=${x.arnia}">${x.arnia}</a></td><td>${esc(x.regina||'-')}</td><td>${esc(x.covata||'-')}</td><td>${esc(x.scorte||'-')}</td><td>${esc(x.forza_famiglia||'-')}</td><td>${esc(x.peso||'-')}</td><td>${esc(x.temperatura||'-')}</td><td>${esc(x.umidita||'-')}</td><td>${esc(x.suono||'-')}</td><td>${esc(x.prossima_azione||'-')}</td><td>${esc(x.note||'-')}</td><td>${fmt(x.data_visita)}</td></tr>`).join('');document.getElementById('cards').innerHTML=v.map(x=>`<article class="hive"><div class="hive-head"><a class="arnia" href="./?arnia=${x.arnia}">🐝 ${x.arnia}</a><span>${fmt(x.data_visita)}</span></div><div class="hive-grid"><div>👑 ${esc(x.regina||'-')}</div><div>💪 ${esc(x.forza_famiglia||'-')}</div><div>🐣 ${esc(x.covata||'-')}</div><div>🍯 ${esc(x.scorte||'-')}</div><div>⚖️ ${esc(x.peso||'-')}</div><div>🌡️ ${esc(x.temperatura||'-')}</div><div>💧 ${esc(x.umidita||'-')}</div><div>🎤 ${esc(x.suono||'-')}</div><div class="note">📋 ${esc(x.prossima_azione||'-')}</div><div class="note">📝 ${esc(x.note||'-')}</div></div></article>`).join('')}
async function load(){const status=document.getElementById('status');status.className='muted';status.textContent='Caricamento dati...';try{latest=selectLatest(await request());const count=latest.filter(x=>x.data_visita).length;document.getElementById('withData').textContent=count;document.getElementById('withoutData').textContent=50-count;status.textContent='Ultimo aggiornamento: '+new Date().toLocaleTimeString('it-IT');show()}catch(e){status.className='error';status.textContent='Errore caricamento: '+e.message}}
document.getElementById('search').addEventListener('input',show);document.getElementById('range').addEventListener('change',show);document.getElementById('reload').addEventListener('click',load);load();
</script></body></html>
