<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Apiario digitale</title><style>*{box-sizing:border-box}body{margin:0;padding:10px;font-family:Arial,sans-serif;color:#222}.wrap{max-width:650px;margin:auto}.hero{text-align:center}.card,.visit{border:1px solid #ddd;border-radius:14px;overflow:hidden}.visit{padding:12px;margin:9px 0;background:#fafafa}table{width:100%;border-collapse:collapse}td{padding:10px 8px;border-bottom:1px solid #e7e7e7}.ico{width:42px;text-align:center;font-size:21px}.campo{font-weight:700;width:36%}.valinput{width:100%;border:1px solid transparent;border-radius:8px;padding:8px;font:inherit}.valinput:focus{border-color:#d99000;outline:none}.ver{color:#b86600;font-weight:700}button{width:100%;border:0;border-radius:14px;padding:14px;margin-top:10px;font-size:16px;font-weight:700;color:#fff}.mic{background:#d99000}.mic.on{background:#c62828}.save{background:#2e7d32}.msg{font-size:14px;color:#555;line-height:1.4}.ok{color:#176b20}.error{color:#b00020;word-break:break-word}.visit p{margin:5px 0;font-size:14px}.date{font-weight:700}</style></head><body><main class="wrap"><div class="hero"><h1 id="hiveTitle">🐝 Arnia</h1></div><div class="card"><table><tbody id="rows"></tbody></table></div><button id="mic" class="mic">🎤 Modifica a voce</button><button id="save" class="save">💾 Salva visita</button><p id="msg" class="msg">Premi il microfono e parla quando compare “Sto ascoltando…”.</p><h2 id="historyTitle">📚 Storico visite</h2><div id="history">Caricamento...</div></main><script>
'use strict';
const SUPABASE_URL='https://zyigecgmidnpacnfwlym.supabase.co',SUPABASE_KEY='sb_publishable_nZVA6m0GfnF6nthL2Exh3A_5PMhouC0',TABLE='Visite';
const q=new URLSearchParams(location.search),raw=(q.get('arnia')||'A07').trim().toUpperCase(),num=Number(raw.slice(1)),ARNIA=/^A\d{2}$/.test(raw)&&num>=1&&num<=50?raw:'A07';
document.title='Arnia '+ARNIA;document.getElementById('hiveTitle').textContent='🐝 Arnia '+ARNIA;document.getElementById('historyTitle').textContent='📚 Storico visite '+ARNIA;
const ENDPOINT=SUPABASE_URL+'/rest/v1/'+TABLE,headers={apikey:SUPABASE_KEY,Authorization:'Bearer '+SUPABASE_KEY};
let current={Arnia:ARNIA,Regina:'Da verificare',Covata:'Da verificare',Scorte:'Da verificare','Forza famiglia':'Da verificare','Prossima azione':'Da verificare',Peso:'Da verificare',Temperatura:'Da verificare','Umidità':'Da verificare',Suono:'Da verificare',Note:''};
const icons={Arnia:'🐝',Regina:'👑',Covata:'🐣',Scorte:'🍯','Forza famiglia':'💪','Prossima azione':'📋',Peso:'⚖️',Temperatura:'🌡️','Umidità':'💧',Suono:'🎤',Note:'📝'};
const keys=[['prossima azione','Prossima azione'],['forza famiglia','Forza famiglia'],['temperatura','Temperatura'],['umidità','Umidità'],['umidita','Umidità'],['regina','Regina'],['covata','Covata'],['scorte','Scorte'],['peso','Peso'],['suono','Suono'],['note','Note']];
const rows=document.getElementById('rows'),msg=document.getElementById('msg'),history=document.getElementById('history'),mic=document.getElementById('mic');
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function render(){rows.innerHTML=Object.entries(current).map(([k,v])=>`<tr><td class="ico">${icons[k]}</td><td class="campo">${esc(k)}</td><td>${k==='Arnia'?`<b>${ARNIA}</b>`:`<input class="valinput ${v==='Da verificare'?'ver':''}" data-key="${esc(k)}" value="${esc(v)}">`}</td></tr>`).join('');document.querySelectorAll('.valinput').forEach(el=>el.addEventListener('input',e=>{current[e.target.dataset.key]=e.target.value}))}
function normalizeVoice(text){return text.toLocaleLowerCase('it-IT').replace(/la regina (è|e) /g,'regina ').replace(/ci sono /g,'').replace(/le scorte sono /g,'scorte ').replace(/la forza (della )?famiglia (è|e) /g,'forza famiglia ').replace(/il peso (è|e) /g,'peso ').replace(/la temperatura (è|e) /g,'temperatura ').replace(/l['’]umidità (è|e) /g,'umidità ').replace(/il suono (è|e) /g,'suono ').replace(/come prossima azione /g,'prossima azione ').replace(/(?:come )?note?[: ]+/g,'note ')}
function applySpeech(text){const t=normalizeVoice(text);let hits=[];keys.forEach(([a,k])=>{let p=t.indexOf(a);while(p>=0){hits.push({a,k,p});p=t.indexOf(a,p+a.length)}});hits.sort((a,b)=>a.p-b.p);hits=hits.filter((x,i,a)=>!i||x.p!==a[i-1].p);if(!hits.length){msg.textContent='Ho sentito: “'+text+'”, ma non ho riconosciuto nessun campo.';return}let changed=[];hits.forEach((x,i)=>{let v=t.slice(x.p+x.a.length,i+1<hits.length?hits[i+1].p:t.length).trim().replace(/^[,:;=\-\s]+|[,:;.\s]+$/g,'').replace(/\s+(e|poi)$/,'').trim();if(v){current[x.k]=v.charAt(0).toUpperCase()+v.slice(1);changed.push(x.k)}});render();msg.className='msg ok';msg.textContent='✓ Riconosciuto: “'+text+'”. Aggiornati: '+changed.join(', ')}
const SpeechRecognition=window.SpeechRecognition||window.webkitSpeechRecognition;let recognition;if(SpeechRecognition){recognition=new SpeechRecognition();recognition.lang='it-IT';recognition.continuous=false;recognition.interimResults=false;recognition.maxAlternatives=1;recognition.onstart=()=>{mic.classList.add('on');mic.textContent='🎙️ Sto ascoltando…';msg.className='msg';msg.textContent='Parla adesso.'};recognition.onresult=e=>applySpeech(e.results[0][0].transcript);recognition.onerror=e=>{msg.className='msg error';msg.textContent='Errore microfono: '+e.error+'. Verifica il permesso microfono del browser.'};recognition.onend=()=>{mic.classList.remove('on');mic.textContent='🎤 Modifica a voce'};mic.onclick=()=>{try{recognition.start()}catch(e){msg.textContent='Attendi un secondo e riprova.'}}}else{mic.disabled=true;mic.style.opacity='.55';msg.className='msg error';msg.textContent='Questo browser non supporta il riconoscimento vocale. Apri il QR in Chrome o Edge e consenti il microfono.'}
async function req(url,opt={}){const r=await fetch(url,{...opt,mode:'cors',headers:{...headers,...(opt.headers||{})}}),text=await r.text();if(!r.ok)throw new Error('HTTP '+r.status+' '+text);return text?JSON.parse(text):null}
function visit(x){return `<article class="visit"><div class="date">📅 ${new Date(x.data_visita).toLocaleString('it-IT')}</div><p>👑 <b>Regina:</b> ${esc(x.regina)}</p><p>🐣 <b>Covata:</b> ${esc(x.covata)}</p><p>🍯 <b>Scorte:</b> ${esc(x.scorte)}</p><p>💪 <b>Forza:</b> ${esc(x.forza_famiglia)}</p><p>📋 <b>Azione:</b> ${esc(x.prossima_azione)}</p><p>⚖️ <b>Peso:</b> ${esc(x.peso)}</p><p>🌡️ <b>Temperatura:</b> ${esc(x.temperatura)}</p><p>💧 <b>Umidità:</b> ${esc(x.umidita)}</p><p>🎤 <b>Suono:</b> ${esc(x.suono)}</p><p>📝 <b>Note:</b> ${esc(x.note)}</p></article>`}
async function load(){try{let v=await req(ENDPOINT+'?select=*&arnia=eq.'+encodeURIComponent(ARNIA)+'&order=data_visita.desc');history.innerHTML=v.length?v.map(visit).join(''):'Nessuna visita salvata per '+ARNIA+'.';if(v.length){let x=v[0];Object.assign(current,{Regina:x.regina||'',Covata:x.covata||'',Scorte:x.scorte||'','Forza famiglia':x.forza_famiglia||'','Prossima azione':x.prossima_azione||'',Peso:x.peso||'',Temperatura:x.temperatura||'','Umidità':x.umidita||'',Suono:x.suono||'',Note:x.note||''});render()}}catch(e){history.innerHTML='<p class="error">Errore: '+esc(e.message)+'</p>'}}
document.getElementById('save').onclick=async()=>{const row={arnia:ARNIA,data_visita:new Date().toISOString(),regina:current.Regina,covata:current.Covata,scorte:current.Scorte,forza_famiglia:current['Forza famiglia'],prossima_azione:current['Prossima azione'],peso:current.Peso,temperatura:current.Temperatura,umidita:current['Umidità'],suono:current.Suono,note:current.Note};try{await req(ENDPOINT,{method:'POST',headers:{'Content-Type':'application/json',Prefer:'return=minimal'},body:JSON.stringify(row)});msg.className='msg ok';msg.textContent='✓ Visita '+ARNIA+' salvata.';await load()}catch(e){msg.className='msg error';msg.textContent='Errore salvataggio: '+e.message}};render();load();
</script></body></html>
